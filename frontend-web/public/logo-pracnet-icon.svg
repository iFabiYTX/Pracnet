<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="iconAmberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="iconShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#iconAmberGrad)" filter="url(#iconShadow)" />
  <rect x="42" y="42" width="428" height="428" rx="102" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-opacity="0.35" />

  <!-- Center Graphic -->
  <g transform="translate(106, 96)">
    <!-- Graduation Cap Top -->
    <polygon points="150,50 275,110 150,170 25,110" fill="#002B49" />
    
    <!-- Cap Skull -->
    <path d="M65,130 L65,190 C65,230 235,230 235,190 L235,130" fill="#002B49" />
    
    <!-- Tassel -->
    <path d="M255,120 L285,160 L285,220" fill="none" stroke="#002B49" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="285" cy="225" r="10" fill="#002B49" />

    <!-- Connected Network / Hub Nodes -->
    <g transform="translate(0, 40)">
      <line x1="50" y1="210" x2="150" y2="190" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" />
      <line x1="150" y1="190" x2="250" y2="210" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" />
      <line x1="150" y1="190" x2="150" y2="255" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" />

      <circle cx="50" cy="210" r="15" fill="#002B49" stroke="#FFFFFF" stroke-width="6" />
      <circle cx="150" cy="190" r="19" fill="#FFFFFF" />
      <circle cx="150" cy="190" r="11" fill="#002B49" />
      <circle cx="250" cy="210" r="15" fill="#002B49" stroke="#FFFFFF" stroke-width="6" />
      <circle cx="150" cy="255" r="15" fill="#002B49" stroke="#FFFFFF" stroke-width="6" />
    </g>
  </g>
</svg>
