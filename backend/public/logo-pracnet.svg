<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003865" />
      <stop offset="100%" stop-color="#001F3F" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Left Emblem / Isotype -->
  <g transform="translate(30, 20)">
    <!-- Squircle / Rounded Shield Container -->
    <rect x="0" y="0" width="180" height="180" rx="42" fill="url(#amberGrad)" filter="url(#subtleShadow)" />
    
    <!-- Inner Accent Ring -->
    <rect x="4" y="4" width="172" height="172" rx="38" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.3" />

    <!-- Stylized Modern Graduation Cap + Network Node Core -->
    <g transform="translate(30, 32)">
      <!-- Cap Diamond -->
      <polygon points="60,20 110,44 60,68 10,44" fill="#002B49" />
      
      <!-- Cap Base / Skullcap -->
      <path d="M26,52 L26,76 C26,92 94,92 94,76 L94,52" fill="#002B49" />
      
      <!-- Tassel & Cord -->
      <path d="M102,48 L114,64 L114,88" fill="none" stroke="#002B49" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="114" cy="90" r="4" fill="#002B49" />

      <!-- Network Nodes (Interconnection / NET) -->
      <g transform="translate(0, 16)">
        <line x1="20" y1="84" x2="60" y2="76" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
        <line x1="60" y1="76" x2="100" y2="84" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
        <line x1="60" y1="76" x2="60" y2="102" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />

        <circle cx="20" cy="84" r="6" fill="#002B49" stroke="#FFFFFF" stroke-width="2.5" />
        <circle cx="60" cy="76" r="7.5" fill="#FFFFFF" />
        <circle cx="60" cy="76" r="4.5" fill="#002B49" />
        <circle cx="100" cy="84" r="6" fill="#002B49" stroke="#FFFFFF" stroke-width="2.5" />
        <circle cx="60" cy="102" r="6" fill="#002B49" stroke="#FFFFFF" stroke-width="2.5" />
      </g>
    </g>
  </g>

  <!-- Brand Typography (Light / Neutral background version) -->
  <g transform="translate(245, 115)">
    <!-- PRACNET -->
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="78" letter-spacing="-1">
      <tspan fill="#002B49">PRAC</tspan><tspan fill="#D97706">NET</tspan>
    </text>
    
    <!-- Subtitle: SISTEMA DE GESTIÓN -->
    <text x="3" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="19" fill="#64748B" letter-spacing="7">
      SISTEMA DE GESTIÓN
    </text>

    <!-- Institutional Tag -->
    <g transform="translate(3, 56)">
      <rect x="0" y="0" width="280" height="22" rx="6" fill="#F1F5F9" />
      <text x="140" y="15" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="11" fill="#003865" text-anchor="middle" letter-spacing="1.5">
        UNIVERSIDAD TÉCNICA FEDERICO SANTA MARÍA
      </text>
    </g>
  </g>
</svg>
